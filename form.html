<!DOCTYPE html>
<html>
<head>
    <title>Student Login Form</title>
</head>

<body style="background-color: #e6f2ff; font-family: Arial;">

    <h1 style="background-color: #003366; color: white; 
               text-align: center; padding: 20px;">
        Student Login Form
    </h1>

    <form style="background-color: white; width: 500px; 
                 margin: 30px auto; padding: 25px; 
                 border-radius: 10px;">

        <h2 style="background-color: #3399ff; color: white; 
                   padding: 10px; text-align: center;">
            Student Details
        </h2>

        <label>Full Name:</label><br>
        <input type="text" name="name" placeholder="Enter your name"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Registration Number:</label><br>
        <input type="text" name="regno" placeholder="Enter registration number"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter email"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter phone number"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>

        <label>Branch:</label><br>
        <select name="Branch" style="width: 99%; padding: 8px;">
            <option>Select Branch</option>
            <option>CSE(AI)</option>
            <option>CSE(DS)</option>
            <option>CIVIL</option>
            <option>MECHNICAL</option>
            <option>ELECTRICAL</option>
        </select><br><br>

        <label>Address:</label><br>
        <textarea name="address" placeholder="Enter your address"
                  style="width: 95%; height: 70px; padding: 8px;">
        </textarea><br><br>

        <h2 style="background-color: #3399ff; color: white; 
                   padding: 10px; text-align: center;">
            Login Details
        </h2>

        <label>Username:</label><br>
        <input type="text" name="username" placeholder="Enter username"
               style="width: 95%; padding: 8px;"><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" placeholder="Enter password"
               style="width: 95%; padding: 8px;"><br><br>

        <input type="submit" value="Login"
               style="background-color: #003366; color: white; 
                      padding: 12px 30px; border: none; 
                      border-radius: 5px;">

        <input type="reset" value="Reset"
               style="background-color: #ff6666; color: white; 
                      padding: 12px 30px; border: none; 
                      border-radius: 5px;">

    </form>

</body>
</html>
